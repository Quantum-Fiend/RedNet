version: '3.8'

services:
  # C Packet Sniffer (compiled as library)
  c-sniffer:
    build:
      context: ./c-sniffer
      dockerfile: ../docker/Dockerfile.c-sniffer
    volumes:
      - ./c-sniffer:/app
    command: make all

  # Rust Crypto Engine
  rust-crypto:
    build:
      context: ./rust-crypto
      dockerfile: ../docker/Dockerfile.rust-crypto
    volumes:
      - ./rust-crypto:/app
      - cargo-cache:/usr/local/cargo/registry
    command: cargo build --release

  # Go CLI
  go-cli:
    build:
      context: ./go-cli
      dockerfile: ../docker/Dockerfile.go-cli
    depends_on:
      - c-sniffer
      - rust-crypto
    volumes:
      - ./go-cli:/app
      - ./c-sniffer/lib:/c-sniffer/lib
      - ./rust-crypto/target/release:/rust-crypto/target/release
    ports:
      - "8080:8080"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host

  # Python Payload Generator
  python-payload:
    build:
      context: ./python-payload
      dockerfile: ../docker/Dockerfile.python-payload
    volumes:
      - ./python-payload:/app
    command: python -m rednet_payload.cli --help

  # Web Dashboard Frontend
  web-dashboard:
    build:
      context: ./web-dashboard
      dockerfile: ../docker/Dockerfile.web-dashboard
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_WS_URL=ws://localhost:3001
    depends_on:
      - backend

  # Backend Server
  backend:
    build:
      context: ./web-dashboard
      dockerfile: ../docker/Dockerfile.backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - JWT_SECRET=rednet-production-secret-change-me
      - NODE_ENV=production
    volumes:
      - ./web-dashboard/backend:/app/backend

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=rednet
      - POSTGRES_USER=rednet
      - POSTGRES_PASSWORD=rednet_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  cargo-cache:
  postgres-data:
  redis-data:

networks:
  default:
    name: rednet-network
