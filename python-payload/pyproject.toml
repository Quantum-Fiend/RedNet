[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rednet-payload"
version = "1.0.0"
description = "RedNet Payload Generator - Security Testing Tool"
authors = [{name = "RedNet Security Team"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "click>=8.1.0",
    "pycryptodome>=3.19.0",
    "jinja2>=3.1.0",
]

[project.scripts]
rednet-payload = "rednet_payload.cli:cli"
